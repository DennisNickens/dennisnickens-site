<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>The Blueprint Assessment | Dennis Nickens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --purple:#7C3AED; --purple-soft:#A78BFA; --gold:#FFD700; --blue:#3B82F6;
  --bg:#0F172A; --panel:#1E293B; --panel2:#243449; --line:#334155;
  --text:#E2E8F0; --muted:#94A3B8;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  font-family:'Inter',sans-serif; background:var(--bg); color:var(--text);
  min-height:100vh; overflow-x:hidden;
}
#pc{position:fixed;inset:0;z-index:0;pointer-events:none;}
.wrap{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:20px 16px 60px;}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 18px;}
.brand{font-family:'Playfair Display',serif;font-size:1.05rem;color:var(--purple-soft);letter-spacing:.04em;}
.qcount{font-size:.8rem;color:var(--muted);font-weight:500;white-space:nowrap;}

.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:8px;}
.progress-fill{height:100%;width:0%;border-radius:3px;background:linear-gradient(90deg,var(--purple),var(--gold));transition:width .35s ease;}
.pillar-tag{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:26px;}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px 22px;box-shadow:0 8px 30px rgba(0,0,0,.35);}
.qtext{font-family:'Playfair Display',serif;font-size:1.22rem;line-height:1.5;margin-bottom:8px;}
.hint{font-size:.82rem;color:var(--muted);margin-bottom:20px;}

.opt{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  background:var(--panel2);border:1px solid var(--line);border-radius:10px;
  padding:14px 16px;margin-bottom:10px;color:var(--text);
  font-family:'Inter',sans-serif;font-size:.95rem;line-height:1.45;cursor:pointer;
  transition:border-color .15s,background .15s,transform .1s;
}
.opt:hover{border-color:var(--purple-soft);}
.opt:active{transform:scale(.99);}
.opt.ranked{border-color:var(--purple);background:rgba(124,58,237,.12);}
.rank-badge{
  flex:0 0 30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:.85rem;border:2px solid var(--line);color:var(--muted);
}
.opt.ranked .rank-badge{border-color:var(--gold);color:var(--gold);}

.controls{display:flex;justify-content:space-between;align-items:center;margin-top:22px;gap:12px;}
.btn{
  font-family:'Montserrat',sans-serif;font-weight:600;font-size:.9rem;letter-spacing:.03em;
  border:none;border-radius:10px;padding:13px 26px;cursor:pointer;transition:opacity .15s,transform .1s;
}
.btn:active{transform:scale(.98);}
.btn-primary{background:linear-gradient(135deg,var(--purple),#6D28D9);color:#fff;}
.btn-primary:disabled{opacity:.35;cursor:default;}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--line);}
.btn-link{background:none;border:none;color:var(--muted);font-size:.8rem;cursor:pointer;text-decoration:underline;}

.interstitial{text-align:center;padding:46px 22px;}
.interstitial h2{font-family:'Playfair Display',serif;font-size:1.7rem;color:var(--gold);margin-bottom:14px;}
.interstitial p{color:var(--muted);line-height:1.7;max-width:460px;margin:0 auto 30px;}

.loading-screen{text-align:center;padding:80px 20px;}
.spinner{width:44px;height:44px;border:3px solid var(--line);border-top-color:var(--purple);border-radius:50%;margin:0 auto 20px;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

.err{background:rgba(239,68,68,.12);border:1px solid #EF4444;border-radius:10px;padding:14px 16px;color:#FCA5A5;font-size:.88rem;margin-top:16px;display:none;}

@media(max-width:480px){
  .qtext{font-size:1.08rem;}
  .opt{padding:12px 13px;font-size:.9rem;}
  .card{padding:20px 15px;}
}
</style>
</head>
<body>
<canvas id="pc"></canvas>
<div class="wrap">
  <div class="topbar">
    <div class="brand">THE BLUEPRINT</div>
    <div class="qcount" id="qcount"></div>
  </div>
  <div class="progress"><div class="progress-fill" id="pfill"></div></div>
  <div class="pillar-tag" id="ptag"></div>
  <div id="stage">
    <div class="loading-screen"><div class="spinner"></div><p style="color:var(--muted)">Loading your assessment...</p></div>
  </div>
</div>

<script>
'use strict';

var PILLAR_INTROS={
  core:{title:'Behavior Profile',blurb:'How you naturally move through the world. There are no right answers here, only honest ones. Rank each set of responses from most like you to least like you.'},
  currency:{title:'Connection Currency',blurb:'People give and receive care in different currencies. This section reveals which currencies you trade in most naturally.'},
  channel:{title:'Learning Channel',blurb:'How information reaches you best. Understanding your channel changes how you communicate and how others should communicate with you.'},
  compass:{title:'Spiritual Compass',blurb:'What actually guides your biggest decisions. This section maps the values underneath everything else.'},
  partnership:{title:'Partnership Dynamics',blurb:'How you show up in romantic relationships. Answer for who you actually are, not who you aspire to be.'},
  family:{title:'Family Dynamics',blurb:'The role you naturally play in your household and family system.'},
  career:{title:'Career Dynamics',blurb:'Your professional wiring. How you work, lead, contribute, and what energizes you.'},
  ministry:{title:'Ministry Dynamics',blurb:'How you are wired to serve. The final section of your Blueprint.'}
};

var params=new URLSearchParams(location.search);
var cid=params.get('cid')||'';
if(!cid){window.location.href='intake.html';}

var STORE_KEY='sr:assessment:'+cid;
var bank=null, tier=null, questions=[], idx=0, answers={}, pendingRanks={}, seenIntros={};

function saveState(){
  try{localStorage.setItem(STORE_KEY,JSON.stringify({tier:tier,idx:idx,answers:answers,seenIntros:seenIntros}));}catch(_){}
}
function loadState(){
  try{return JSON.parse(localStorage.getItem(STORE_KEY)||'null');}catch(_){return null;}
}

function buildQuestionList(){
  questions=[];
  var pillars=bank.tiers[tier]||bank.tiers.light;
  for(var i=0;i<pillars.length;i++){
    var p=pillars[i];
    var qs=bank.pillars[p]||[];
    for(var j=0;j<qs.length;j++){questions.push(qs[j]);}
  }
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function render(){
  var stage=document.getElementById('stage');
  if(idx>=questions.length){renderSubmit();return;}
  var q=questions[idx];

  // Pillar interstitial before the first question of each pillar
  if(!seenIntros[q.pillar]){
    var intro=PILLAR_INTROS[q.pillar]||{title:bank.display[q.pillar],blurb:''};
    document.getElementById('ptag').textContent='';
    stage.innerHTML='<div class="card interstitial">'
      +'<h2>'+esc(intro.title)+'</h2>'
      +'<p>'+esc(intro.blurb)+'</p>'
      +'<button class="btn btn-primary" id="introBtn">Begin This Section</button>'
      +'</div>';
    document.getElementById('introBtn').addEventListener('click',function(){
      seenIntros[q.pillar]=true;saveState();render();
    });
    updateChrome();
    return;
  }

  pendingRanks=answers[q.id]?Object.assign({},answers[q.id]):{};
  var optKeys=Object.keys(q.options);
  var html='<div class="card">'
    +'<div class="qtext">'+esc(q.text)+'</div>'
    +'<div class="hint">Tap the responses in order, most like you first. Tap a choice again to unrank it.</div>';
  for(var i=0;i<optKeys.length;i++){
    var k=optKeys[i];
    var r=pendingRanks[k]||'';
    html+='<button class="opt'+(r?' ranked':'')+'" data-opt="'+k+'">'
      +'<span class="rank-badge">'+(r||'')+'</span>'
      +'<span>'+esc(q.options[k])+'</span></button>';
  }
  html+='<div class="controls">'
    +'<button class="btn btn-ghost" id="backBtn"'+(idx===0?' style="visibility:hidden"':'')+'>Back</button>'
    +'<button class="btn btn-primary" id="nextBtn" disabled>Next</button>'
    +'</div></div>';
  stage.innerHTML=html;

  var opts=stage.querySelectorAll('.opt');
  for(var j=0;j<opts.length;j++){
    opts[j].addEventListener('click',onOptTap);
  }
  document.getElementById('backBtn').addEventListener('click',function(){
    if(idx>0){idx--;saveState();render();}
  });
  document.getElementById('nextBtn').addEventListener('click',commitAndNext);
  refreshRankUI();
  updateChrome();
}

function onOptTap(e){
  var btn=e.currentTarget;
  var k=btn.getAttribute('data-opt');
  var q=questions[idx];
  var totalOpts=Object.keys(q.options).length;
  if(pendingRanks[k]){
    // Unrank this option and close the gap
    var removed=pendingRanks[k];
    delete pendingRanks[k];
    for(var o in pendingRanks){if(pendingRanks[o]>removed)pendingRanks[o]--;}
  }else{
    var used=Object.keys(pendingRanks).length;
    if(used>=totalOpts)return;
    pendingRanks[k]=used+1;
  }
  refreshRankUI();
}

function refreshRankUI(){
  var q=questions[idx];
  var totalOpts=Object.keys(q.options).length;
  var stage=document.getElementById('stage');
  var opts=stage.querySelectorAll('.opt');
  for(var i=0;i<opts.length;i++){
    var k=opts[i].getAttribute('data-opt');
    var badge=opts[i].querySelector('.rank-badge');
    if(pendingRanks[k]){opts[i].classList.add('ranked');badge.textContent=pendingRanks[k];}
    else{opts[i].classList.remove('ranked');badge.textContent='';}
  }
  var done=Object.keys(pendingRanks).length===totalOpts;
  var nextBtn=document.getElementById('nextBtn');
  if(nextBtn)nextBtn.disabled=!done;
}

function commitAndNext(){
  var q=questions[idx];
  answers[q.id]=Object.assign({},pendingRanks);
  idx++;
  saveState();
  render();
  window.scrollTo(0,0);
}

function updateChrome(){
  var answered=Math.min(idx,questions.length);
  document.getElementById('qcount').textContent='Question '+Math.min(idx+1,questions.length)+' of '+questions.length;
  document.getElementById('pfill').style.width=(answered/questions.length*100)+'%';
  var q=questions[Math.min(idx,questions.length-1)];
  document.getElementById('ptag').textContent=q?bank.display[q.pillar]:'';
}

function renderSubmit(){
  document.getElementById('ptag').textContent='';
  document.getElementById('qcount').textContent='Complete';
  document.getElementById('pfill').style.width='100%';
  var stage=document.getElementById('stage');
  stage.innerHTML='<div class="card interstitial">'
    +'<h2>That is every question.</h2>'
    +'<p>Your answers are ready to become your Blueprint. Submit them below and we will start drawing.</p>'
    +'<button class="btn btn-primary" id="submitBtn">Submit My Assessment</button>'
    +'<div class="err" id="err"></div>'
    +'</div>';
  document.getElementById('submitBtn').addEventListener('click',submit);
}

function submit(){
  var btn=document.getElementById('submitBtn');
  btn.disabled=true;btn.textContent='Submitting...';
  fetch('/api/sr-assessment-submit',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({cid:cid,tier:tier,answers:answers})
  }).then(function(r){return r.json();})
    .then(function(data){
      if(data&&data.ok){
        try{localStorage.removeItem(STORE_KEY);}catch(_){}
        window.location.href='complete.html?cid='+encodeURIComponent(cid)+'&sid='+encodeURIComponent(data.sessionId||'');
      }else{
        showErr((data&&data.error)||'Something went wrong. Your answers are saved on this device. Please try again.');
        btn.disabled=false;btn.textContent='Submit My Assessment';
      }
    })
    .catch(function(){
      showErr('We could not reach the server. Your answers are saved on this device. Please check your connection and try again.');
      btn.disabled=false;btn.textContent='Submit My Assessment';
    });
}

function showErr(msg){
  var el=document.getElementById('err');
  el.textContent=msg;el.style.display='block';
}

// Boot: resolve tier (query param first, then contact record), load bank, restore progress
function boot(){
  var qTier=(params.get('tier')||'').toLowerCase();
  var tierReady=qTier&&['light','medium','deep'].indexOf(qTier)!==-1
    ? Promise.resolve(qTier)
    : fetch('/api/sr-get-contact?cid='+encodeURIComponent(cid))
        .then(function(r){return r.json();})
        .then(function(data){
          var f=(data&&data.success&&data.contact&&data.contact.fields)||{};
          var t=String(f.sr_sku_tier||'').toLowerCase();
          return ['light','medium','deep'].indexOf(t)!==-1?t:'light';
        })
        .catch(function(){return 'light';});

  Promise.all([tierReady,fetch('questions/bank.json').then(function(r){return r.json();})])
    .then(function(results){
      tier=results[0];bank=results[1];
      var saved=loadState();
      if(saved&&saved.tier===tier){
        idx=saved.idx||0;answers=saved.answers||{};seenIntros=saved.seenIntros||{};
      }
      buildQuestionList();
      render();
    })
    .catch(function(){
      document.getElementById('stage').innerHTML='<div class="card interstitial"><h2>Something went wrong</h2><p>We could not load the assessment. Please refresh the page or come back in a moment.</p></div>';
    });
}
boot();

// Particle background (matches the rest of the funnel)
var cv=document.getElementById('pc'),cx=cv.getContext('2d');var ps=[];function rsz(){cv.width=window.innerWidth;cv.height=window.innerHeight;}rsz();window.addEventListener('resize',rsz);function P(){this.reset();}P.prototype.reset=function(){this.x=Math.random()*cv.width;this.y=Math.random()*cv.height;this.vx=(Math.random()-.5)*.35;this.vy=(Math.random()-.5)*.35;this.r=Math.random()*1.6+.3;this.a=Math.random()*.45+.08;var t=Math.random();this.c=t>.65?'#7C3AED':t>.35?'#3B82F6':'#FFD700';};P.prototype.update=function(){this.x+=this.vx;this.y+=this.vy;if(this.x<0||this.x>cv.width||this.y<0||this.y>cv.height)this.reset();};P.prototype.draw=function(){cx.beginPath();cx.arc(this.x,this.y,this.r,0,Math.PI*2);cx.fillStyle=this.c;cx.globalAlpha=this.a;cx.fill();cx.globalAlpha=1;};for(var i=0;i<110;i++)ps.push(new P());function ani(){cx.clearRect(0,0,cv.width,cv.height);for(var i=0;i<ps.length;i++){ps[i].update();ps[i].draw();}requestAnimationFrame(ani);}ani();
</script>
</body>
</html>
