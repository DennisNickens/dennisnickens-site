<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Confirm Your Choices | The Blueprint</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Dancing+Script:wght@700&family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
:root{--bg:#07071a;--bg-mid:#0f0a2e;--ink:#f5f1e8;--ink-s:rgba(245,241,232,0.78);--gold:#d4a957;--gold-s:#b08838;--line:rgba(212,169,87,0.18);--ff:'Playfair Display',Georgia,serif;--fs:'Cormorant Garamond',Georgia,serif;--fn:'Inter',-apple-system,sans-serif;--fl:'Montserrat',-apple-system,sans-serif;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{font-family:var(--fn);color:#fff;background:linear-gradient(135deg,#0D0B1E,#1a1235,#0D0B1E) fixed !important;line-height:1.6;min-height:100vh;}
.bg{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse at 20% 10%,rgba(124,58,237,.18),transparent 50%),radial-gradient(ellipse at 80% 60%,rgba(6,182,212,.10),transparent 55%),linear-gradient(180deg,#07071a,#0f0a2e 50%,#07071a);pointer-events:none;}
.nav{position:sticky;top:0;z-index:50;padding:1.25rem 2rem;display:flex;align-items:center;backdrop-filter:blur(14px);background:rgba(7,7,26,.7);border-bottom:1px solid var(--line);}
.nav a{display:flex;align-items:center;gap:.75rem;text-decoration:none;color:var(--ink);}
.nav img{width:48px;height:48px;object-fit:contain;filter:drop-shadow(0 0 12px rgba(212,169,87,.4));}
.nav-name{font-family:'Allura',cursive;font-size:1.75rem;color:var(--gold);line-height:1;}
.nav-sub{font-family:var(--fl);font-size:.62rem;letter-spacing:.18em;color:var(--gold);text-transform:uppercase;}
main{position:relative;z-index:5;min-height:calc(100vh - 90px);display:flex;align-items:center;justify-content:center;padding:3rem 1.5rem;}
.card{max-width:760px;width:100%;background:linear-gradient(180deg,rgba(26,19,64,.75),rgba(15,10,46,.55));border:1px solid var(--gold);border-radius:16px;padding:clamp(2.25rem,5vw,3.5rem);backdrop-filter:blur(16px);}
.progress-wrap{margin-bottom:2.25rem;}
.progress-label{font-family:var(--fl);font-size:.72rem;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);margin-bottom:.6rem;text-align:center;}
.progress-track{height:6px;background:rgba(212,169,87,0.15);border-radius:50px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(135deg,var(--gold),var(--gold-s));border-radius:50px;}
.bp-brand{text-align:center;margin:0 0 2.25rem;}
.bp-brand-logo{display:block;max-width:180px;width:30vw;min-width:120px;height:auto;margin:0 auto 1.5rem;}
.bp-brand-name{font-family:'Playfair Display',serif;font-weight:700;font-size:clamp(22px,3.4vw,30px);letter-spacing:.24em;padding-left:.24em;text-transform:uppercase;color:#FFD700;line-height:1.15;}
.bp-brand-by{font-family:'Inter',sans-serif;font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,0.55);margin-top:.55rem;}
.bp-brand-byline-name{font-family:'Dancing Script',cursive;font-weight:700;font-size:1.4em;color:#FFD700;letter-spacing:normal;text-transform:none;margin:0 0.1em;}
.eyebrow{font-family:var(--fl);font-size:.75rem;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);margin-bottom:1rem;text-align:center;}
.eyebrow::before,.eyebrow::after{content:"\2726";margin:0 .6rem;}
h1{font-family:var(--ff);font-size:clamp(1.9rem,4.5vw,2.8rem);font-weight:400;line-height:1.15;margin-bottom:.75rem;text-align:center;}
h1 em{font-style:italic;background:linear-gradient(135deg,var(--gold),#f0d490);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.sub{font-family:var(--fs);font-style:italic;font-size:clamp(1.05rem,2vw,1.2rem);color:var(--ink-s);margin-bottom:2.25rem;line-height:1.5;text-align:center;}
.review{display:grid;gap:1rem;margin-bottom:2.25rem;}
.rrow{padding:1.1rem 1.35rem;background:rgba(212,169,87,.06);border:1px solid rgba(212,169,87,.15);border-radius:10px;}
.rhead{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:.5rem;}
.rlabel{font-family:var(--fl);font-size:.68rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);}
.redit{font-family:var(--fl);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-s);text-decoration:none;border-bottom:1px solid var(--line);transition:all .25s;}
.redit:hover{color:var(--gold);border-color:var(--gold);}
.rvalue{font-size:1rem;color:var(--ink);line-height:1.55;}
.rvalue ul{list-style:none;display:flex;flex-direction:column;gap:.3rem;}
.rvalue li{padding-left:1.15rem;position:relative;}
.rvalue li::before{content:"\2726";position:absolute;left:0;color:var(--gold);font-size:.55rem;top:.3rem;}
.divider{width:60px;height:1px;background:var(--gold);margin:0 auto 2rem;opacity:.4;}
.btn-center{text-align:center;}
.btn{display:inline-flex;align-items:center;gap:.6rem;padding:1.1rem 2.4rem;font-family:var(--fl);font-size:.85rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;border:none;border-radius:4px;background:linear-gradient(135deg,var(--gold),var(--gold-s));color:#07071a;box-shadow:0 8px 24px rgba(212,169,87,.3);transition:all .3s;cursor:pointer;font-family:var(--fl);}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(212,169,87,.45);}
.arr{transition:transform .3s;}
.btn:hover .arr{transform:translateX(4px);}
.loading{text-align:center;color:var(--ink-s);font-family:var(--fs);font-style:italic;font-size:1.1rem;padding:1rem 0;}
.err{text-align:center;color:#ff8585;font-size:.95rem;margin-top:1rem;}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<canvas id="pc" style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:1;pointer-events:none;"></canvas>
<nav class="nav">
  <a href="../index.html">
    <img src="https://dennisnickens.com/sr-logo-transparent.png" alt="Spiritual Romeo" />
    <div><div class="nav-name">Dennis Nickens</div><div class="nav-sub">AKA Spiritual Romeo</div></div>
  </a>
</nav>
<main>
  <div class="card">
    <div class="progress-wrap">
      <div class="progress-label">Step 5 of 6</div>
      <div class="progress-track"><div class="progress-fill" style="width:83.33%"></div></div>
    </div>
    <div class="bp-brand">
      <img src="../sr-logo-transparent.png" alt="Spiritual Romeo" class="bp-brand-logo" />
      <div class="bp-brand-name">The Blueprint</div>
      <div class="bp-brand-by">By <span class="bp-brand-byline-name">Dennis Nickens</span>, AKA Spiritual Romeo</div>
    </div>
    <div class="eyebrow">Review</div>
    <h1>Does this <em>look right?</em></h1>
    <p class="sub">Take a quick look before we begin. You can edit anything that needs a change.</p>
    <div class="review" id="review"><div class="loading">Loading your selections&hellip;</div></div>
    <div class="divider"></div>
    <div class="btn-center">
      <button type="button" class="btn" id="confirmBtn">Looks Good, Continue <span class="arr">&rarr;</span></button>
      <div class="err" id="errBox" style="display:none;"></div>
    </div>
  </div>
</main>
<script>
// Tier labels keyed BOTH capitalized (current convention, matches survey radio options)
// AND lowercase (legacy convention, kept for backward compat with old contact records
// that were written before the case fix in tiers.html).
var TIER_LABELS={
  Light:"Light (about 10 minutes)",Medium:"Medium (about 20 minutes)",Deep:"Deep (about 45 minutes)",
  light:"Light (about 10 minutes)",medium:"Medium (about 20 minutes)",deep:"Deep (about 45 minutes)"
};
var cid=(new URLSearchParams(location.search)).get('cid')||'';
if(!cid){window.location.href='intake.html';}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function asList(v){
  if(Array.isArray(v))return v;
  if(typeof v==='string'&&v.trim()){
    // GHL may return a multi-select as a comma-separated or array-like string
    try{var p=JSON.parse(v);if(Array.isArray(p))return p;}catch(e){}
    return v.split(/\s*,\s*/).filter(Boolean);
  }
  return [];
}

function render(contact){
  var f=contact.fields||{};
  var name=((contact.firstName||'')+' '+(contact.lastName||'')).trim()||'Not provided';
  var contactInfo=[contact.email,contact.phone].filter(Boolean).join(' &middot; ')||'Not provided';
  var focus=asList(f.sr_qual_focus_areas);
  var audience=f.sr_qual_who_for||'Not selected';
  var tierRaw=f.sr_sku_tier||'';
  var tier=TIER_LABELS[tierRaw]||tierRaw||'Not selected';

  var focusHtml=focus.length
    ? '<ul>'+focus.map(function(i){return '<li>'+esc(i)+'</li>';}).join('')+'</ul>'
    : 'None selected';

  var rows=[
    {label:'Your Name',value:esc(name),edit:'intake.html'},
    {label:'Contact',value:contactInfo,edit:'intake.html'},
    {label:'What You Want to Work On',value:focusHtml,edit:'qualifier-focus.html?cid='+encodeURIComponent(cid)},
    {label:'Who It’s For',value:esc(audience),edit:'qualifier-audience.html?cid='+encodeURIComponent(cid)},
    {label:'Assessment Depth',value:esc(tier),edit:'tiers.html?cid='+encodeURIComponent(cid)}
  ];

  var html='';
  rows.forEach(function(r){
    html+='<div class="rrow"><div class="rhead"><span class="rlabel">'+r.label+'</span>'
      +'<a class="redit" href="'+r.edit+'">Edit</a></div>'
      +'<div class="rvalue">'+r.value+'</div></div>';
  });
  document.getElementById('review').innerHTML=html;
}

fetch('/api/sr-get-contact?cid='+encodeURIComponent(cid))
  .then(function(r){return r.json();})
  .then(function(data){
    if(data&&data.success&&data.contact){
      render(data.contact);
    }else{
      document.getElementById('review').innerHTML='<div class="loading">We could not load your details, but you can still continue.</div>';
    }
  })
  .catch(function(){
    document.getElementById('review').innerHTML='<div class="loading">We could not load your details, but you can still continue.</div>';
  });

document.getElementById('confirmBtn').addEventListener('click',function(){
  window.location.href='welcome.html?cid='+encodeURIComponent(cid);
});
</script>
<script>
// Particle animation (matches the rest of the funnel)
(function(){
  const cv=document.getElementById('pc'),cx=cv.getContext('2d');let ps=[];
  function rsz(){cv.width=window.innerWidth;cv.height=window.innerHeight;}rsz();
  window.addEventListener('resize',rsz);
  class P{constructor(){this.reset();}reset(){this.x=Math.random()*cv.width;this.y=Math.random()*cv.height;this.vx=(Math.random()-.5)*.35;this.vy=(Math.random()-.5)*.35;this.r=Math.random()*1.6+.3;this.a=Math.random()*.45+.08;const t=Math.random();this.c=t>.65?'#7C3AED':t>.35?'#3B82F6':'#FFD700';}update(){this.x+=this.vx;this.y+=this.vy;if(this.x<0||this.x>cv.width||this.y<0||this.y>cv.height)this.reset();}draw(){cx.beginPath();cx.arc(this.x,this.y,this.r,0,Math.PI*2);cx.fillStyle=this.c;cx.globalAlpha=this.a;cx.fill();cx.globalAlpha=1;}}
  for(let i=0;i<110;i++)ps.push(new P());
  function ani(){cx.clearRect(0,0,cv.width,cv.height);ps.forEach(p=>{p.update();p.draw();});requestAnimationFrame(ani);}ani();
})();
</script>
</body>
</html>
