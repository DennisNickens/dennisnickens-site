<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>The Blueprint Assessment | Dennis Nickens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --purple:#7C3AED; --purple-soft:#A78BFA; --gold:#FFD700; --blue:#3B82F6;
  --bg:#0F172A; --panel:#1E293B; --panel2:#243449; --line:#334155;
  --text:#E2E8F0; --muted:#94A3B8;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  font-family:'Inter',sans-serif; background:var(--bg); color:var(--text);
  min-height:100vh; overflow-x:hidden;
}
#pc{position:fixed;inset:0;z-index:0;pointer-events:none;}
.wrap{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:20px 16px 60px;}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 18px;}
.brand{font-family:'Playfair Display',serif;font-size:1.05rem;color:var(--purple-soft);letter-spacing:.04em;}
.qcount{font-size:.8rem;color:var(--muted);font-weight:500;white-space:nowrap;}

.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:8px;}
.progress-fill{height:100%;width:0%;border-radius:3px;background:linear-gradient(90deg,var(--purple),var(--gold));transition:width .35s ease;}
.pillar-tag{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:26px;}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px 22px;box-shadow:0 8px 30px rgba(0,0,0,.35);}
.qtext{font-family:'Playfair Display',serif;font-size:1.22rem;line-height:1.5;margin-bottom:8px;}
.hint{font-size:.82rem;color:var(--muted);margin-bottom:20px;}

.opt{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  background:var(--panel2);border:1px solid var(--line);border-radius:10px;
  padding:14px 16px;margin-bottom:10px;color:var(--text);min-height:44px;
  font-family:'Inter',sans-serif;font-size:.95rem;line-height:1.45;cursor:pointer;
  transition:border-color .15s,background .15s,transform .1s;
}
.opt:hover{border-color:var(--purple-soft);}
.opt:active{transform:scale(.99);}
.opt:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
.opt.selected{border-color:var(--purple);background:rgba(124,58,237,.12);}
.key-badge{
  flex:0 0 30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:.85rem;border:2px solid var(--line);color:var(--muted);
}
.opt.selected .key-badge{border-color:var(--gold);color:var(--gold);}
.opt .picked-check{margin-left:auto;color:var(--gold);font-size:1.05rem;opacity:0;transition:opacity .15s;}
.opt.selected .picked-check{opacity:1;}
.field{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:13px 15px;color:var(--text);font-family:'Inter',sans-serif;font-size:.95rem;margin-bottom:12px;}
.field:focus{outline:2px solid var(--purple-soft);outline-offset:1px;}
.field-label{display:block;text-align:left;font-size:.78rem;color:var(--muted);margin:0 0 6px 2px;}

.controls{display:flex;justify-content:space-between;align-items:center;margin-top:22px;gap:12px;}
.btn{
  font-family:'Montserrat',sans-serif;font-weight:600;font-size:.9rem;letter-spacing:.03em;
  border:none;border-radius:10px;padding:13px 26px;cursor:pointer;transition:opacity .15s,transform .1s;
}
.btn:active{transform:scale(.98);}
.btn-primary{background:linear-gradient(135deg,var(--purple),#6D28D9);color:#fff;}
.btn-primary:disabled{opacity:.35;cursor:default;}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--line);}
.btn-link{background:none;border:none;color:var(--muted);font-size:.8rem;cursor:pointer;text-decoration:underline;}

.interstitial{text-align:center;padding:46px 22px;}
.interstitial h2{font-family:'Playfair Display',serif;font-size:1.7rem;color:var(--gold);margin-bottom:14px;}
.interstitial p{color:var(--muted);line-height:1.7;max-width:460px;margin:0 auto 30px;}

.loading-screen{text-align:center;padding:80px 20px;}
.spinner{width:44px;height:44px;border:3px solid var(--line);border-top-color:var(--purple);border-radius:50%;margin:0 auto 20px;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

.err{background:rgba(239,68,68,.12);border:1px solid #EF4444;border-radius:10px;padding:14px 16px;color:#FCA5A5;font-size:.88rem;margin-top:16px;display:none;}

@media(max-width:480px){
  .qtext{font-size:1.08rem;}
  .opt{padding:12px 13px;font-size:.9rem;}
  .card{padding:20px 15px;}
}
</style>
</head>
<body>
<canvas id="pc"></canvas>
<div class="wrap">
  <div class="topbar">
    <div class="brand">THE BLUEPRINT</div>
    <div class="qcount" id="qcount"></div>
  </div>
  <div class="progress"><div class="progress-fill" id="pfill"></div></div>
  <div class="pillar-tag" id="ptag"></div>
  <div id="stage">
    <div class="loading-screen"><div class="spinner"></div><p style="color:var(--muted)">Loading your assessment...</p></div>
  </div>
</div>

<script>
'use strict';

var PILLAR_INTROS={
  core:{title:'Behavior Profile',blurb:'How you naturally move through the world. There are no right answers here, only honest ones. For each question, pick the one response that sounds most like you.'},
  currency:{title:'Connection Currency',blurb:'People give and receive care in different currencies. This section reveals which currencies you trade in most naturally.'},
  channel:{title:'Learning Channel',blurb:'How information reaches you best. Understanding your channel changes how you communicate and how others should communicate with you.'},
  compass:{title:'Spiritual Compass',blurb:'What actually guides your biggest decisions. This section maps the values underneath everything else.'},
  partnership:{title:'Partnership Dynamics',blurb:'How you show up in romantic relationships. Answer for who you actually are, not who you aspire to be.'},
  family:{title:'Family Dynamics',blurb:'The role you naturally play in your household and family system.'},
  career:{title:'Career Dynamics',blurb:'Your professional wiring. How you work, lead, contribute, and what energizes you.'},
  ministry:{title:'Ministry Dynamics',blurb:'How you are wired to serve. The final section of your Blueprint.'}
};

var params=new URLSearchParams(location.search);
var cid=params.get('cid')||'';
// Linked Pair secondary arrives with ?join={CODE} instead of a cid. The
// join flow validates the code, registers them, and hands back a cid.
var joinCode=String(params.get('join')||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
if(!cid&&!joinCode){window.location.href='intake.html';}

var STORE_KEY=null;
var bank=null, tier=null, forcedTier=null, questions=[], idx=0, answers={}, seenIntros={}, advancing=false;

function saveState(){
  if(!STORE_KEY)return;
  try{localStorage.setItem(STORE_KEY,JSON.stringify({tier:tier,idx:idx,answers:answers,seenIntros:seenIntros}));}catch(_){}
}
function loadState(){
  if(!STORE_KEY)return null;
  try{return JSON.parse(localStorage.getItem(STORE_KEY)||'null');}catch(_){return null;}
}

function buildQuestionList(){
  questions=[];
  var pillars=bank.tiers[tier]||bank.tiers.light;
  for(var i=0;i<pillars.length;i++){
    var p=pillars[i];
    var qs=bank.pillars[p]||[];
    for(var j=0;j<qs.length;j++){questions.push(qs[j]);}
  }
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function render(){
  var stage=document.getElementById('stage');
  if(idx>=questions.length){renderSubmit();return;}
  var q=questions[idx];

  // Pillar interstitial before the first question of each pillar
  if(!seenIntros[q.pillar]){
    var intro=PILLAR_INTROS[q.pillar]||{title:bank.display[q.pillar],blurb:''};
    document.getElementById('ptag').textContent='';
    stage.innerHTML='<div class="card interstitial">'
      +'<h2>'+esc(intro.title)+'</h2>'
      +'<p>'+esc(intro.blurb)+'</p>'
      +'<button class="btn btn-primary" id="introBtn">Begin This Section</button>'
      +'</div>';
    document.getElementById('introBtn').addEventListener('click',function(){
      seenIntros[q.pillar]=true;saveState();render();
    });
    updateChrome();
    return;
  }

  var picked=answers[q.id]||'';
  var optKeys=Object.keys(q.options);
  var html='<div class="card">'
    +'<div class="qtext">'+esc(q.text)+'</div>'
    +'<div class="hint">Pick the one that fits you best. You can go back and change any answer.</div>';
  for(var i=0;i<optKeys.length;i++){
    var k=optKeys[i];
    var sel=picked===k;
    html+='<button type="button" class="opt'+(sel?' selected':'')+'" data-opt="'+k+'" aria-pressed="'+sel+'" aria-label="Option '+(i+1)+': '+esc(q.options[k])+'">'
      +'<span class="key-badge" aria-hidden="true">'+(i+1)+'</span>'
      +'<span>'+esc(q.options[k])+'</span>'
      +'<span class="picked-check" aria-hidden="true">&#10003;</span></button>';
  }
  html+='<div class="controls">'
    +'<button class="btn btn-ghost" id="backBtn"'+(idx===0?' style="visibility:hidden"':'')+'>Back</button>'
    +'<button class="btn btn-primary" id="nextBtn"'+(picked?'':' disabled')+'>Next</button>'
    +'</div></div>';
  stage.innerHTML=html;

  var opts=stage.querySelectorAll('.opt');
  for(var j=0;j<opts.length;j++){
    opts[j].addEventListener('click',function(e){pickOption(e.currentTarget.getAttribute('data-opt'));});
  }
  document.getElementById('backBtn').addEventListener('click',goBack);
  document.getElementById('nextBtn').addEventListener('click',goNext);
  updateChrome();
}

// Pick-one: record the answer, flash the confirmation state, then
// auto-advance after a beat so the click visibly landed.
function pickOption(k){
  if(advancing)return;
  var q=questions[idx];
  if(!q||!q.options[k])return;
  answers[q.id]=k;
  saveState();
  advancing=true;
  var stage=document.getElementById('stage');
  var opts=stage.querySelectorAll('.opt');
  for(var i=0;i<opts.length;i++){
    var sel=opts[i].getAttribute('data-opt')===k;
    opts[i].classList.toggle('selected',sel);
    opts[i].setAttribute('aria-pressed',String(sel));
  }
  var nextBtn=document.getElementById('nextBtn');
  if(nextBtn)nextBtn.disabled=false;
  setTimeout(function(){
    advancing=false;
    idx++;
    saveState();
    render();
    window.scrollTo(0,0);
  },300);
}

function goBack(){
  if(advancing||idx===0)return;
  idx--;saveState();render();window.scrollTo(0,0);
}

// Forward through questions already answered (after using Back).
function goNext(){
  if(advancing||idx>=questions.length)return;
  var q=questions[idx];
  if(!answers[q.id])return;
  idx++;saveState();render();window.scrollTo(0,0);
}

// Keyboard: 1-4 picks an option, arrow keys move between questions.
document.addEventListener('keydown',function(ev){
  if(ev.altKey||ev.ctrlKey||ev.metaKey)return;
  var tag=(document.activeElement&&document.activeElement.tagName)||'';
  if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT')return;
  if(!bank||!questions.length||idx>=questions.length)return;
  var q=questions[idx];
  if(!seenIntros[q.pillar])return;
  if(ev.key>='1'&&ev.key<='9'){
    var keys=Object.keys(q.options);
    var i=parseInt(ev.key,10)-1;
    if(i<keys.length){ev.preventDefault();pickOption(keys[i]);}
  }else if(ev.key==='ArrowLeft'){ev.preventDefault();goBack();}
  else if(ev.key==='ArrowRight'){ev.preventDefault();goNext();}
});

function updateChrome(){
  var answered=Math.min(idx,questions.length);
  document.getElementById('qcount').textContent='Question '+Math.min(idx+1,questions.length)+' of '+questions.length;
  document.getElementById('pfill').style.width=(answered/questions.length*100)+'%';
  var q=questions[Math.min(idx,questions.length-1)];
  document.getElementById('ptag').textContent=q?bank.display[q.pillar]:'';
}

function renderSubmit(){
  document.getElementById('ptag').textContent='';
  document.getElementById('qcount').textContent='Complete';
  document.getElementById('pfill').style.width='100%';
  var stage=document.getElementById('stage');
  stage.innerHTML='<div class="card interstitial">'
    +'<h2>That is every question.</h2>'
    +'<p>Your answers are ready to become your Blueprint. Submit them below and we will start drawing.</p>'
    +'<button class="btn btn-primary" id="submitBtn">Submit My Assessment</button>'
    +'<div class="err" id="err"></div>'
    +'</div>';
  document.getElementById('submitBtn').addEventListener('click',submit);
}

function submit(){
  var btn=document.getElementById('submitBtn');
  btn.disabled=true;btn.textContent='Submitting...';
  fetch('/api/sr-assessment-submit',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({cid:cid,tier:tier,answers:answers})
  }).then(function(r){return r.json();})
    .then(function(data){
      if(data&&data.ok){
        try{localStorage.removeItem(STORE_KEY);}catch(_){}
        window.location.href='complete.html?cid='+encodeURIComponent(cid)+'&sid='+encodeURIComponent(data.sessionId||'');
      }else{
        showErr((data&&data.error)||'Something went wrong. Your answers are saved on this device. Please try again.');
        btn.disabled=false;btn.textContent='Submit My Assessment';
      }
    })
    .catch(function(){
      showErr('We could not reach the server. Your answers are saved on this device. Please check your connection and try again.');
      btn.disabled=false;btn.textContent='Submit My Assessment';
    });
}

function showErr(msg){
  var el=document.getElementById('err');
  el.textContent=msg;el.style.display='block';
}

// Boot: resolve tier (forced for Linked Pair secondaries, then query
// param, then contact record), load bank, restore progress.
function boot(){
  STORE_KEY='sr:assessment:'+cid;
  var qTier=(params.get('tier')||'').toLowerCase();
  var tierReady=forcedTier
    ? Promise.resolve(forcedTier)
    : (qTier&&['light','medium','deep'].indexOf(qTier)!==-1
      ? Promise.resolve(qTier)
      : fetch('/api/sr-get-contact?cid='+encodeURIComponent(cid))
          .then(function(r){return r.json();})
          .then(function(data){
            var f=(data&&data.success&&data.contact&&data.contact.fields)||{};
            var t=String(f.sr_sku_tier||'').toLowerCase();
            return ['light','medium','deep'].indexOf(t)!==-1?t:'light';
          })
          .catch(function(){return 'light';}));

  Promise.all([tierReady,fetch('questions/bank.json').then(function(r){return r.json();})])
    .then(function(results){
      tier=results[0];bank=results[1];
      var saved=loadState();
      if(saved&&saved.tier===tier){
        // Only pick-one (string) answers restore. Ranked answers from
        // before the pick-one UX are dropped so those questions get
        // re-answered in the new format.
        var savedAnswers=saved.answers||{},dropped=false;
        answers={};
        for(var k in savedAnswers){
          if(typeof savedAnswers[k]==='string')answers[k]=savedAnswers[k];
          else dropped=true;
        }
        idx=dropped?0:(saved.idx||0);
        seenIntros=saved.seenIntros||{};
      }
      buildQuestionList();
      render();
    })
    .catch(function(){
      document.getElementById('stage').innerHTML='<div class="card interstitial"><h2>Something went wrong</h2><p>We could not load the assessment. Please refresh the page or come back in a moment.</p></div>';
    });
}

// ------------------------------------------------------------
// Linked Pair join flow (?join={CODE}): validate the code, greet
// the secondary with the primary's name, register them (no
// payment; the Linked Pair purchase covers both people), then run
// the normal Deep assessment with the cid the server hands back.
// ------------------------------------------------------------

function joinBoot(){
  document.getElementById('qcount').textContent='';
  fetch('/api/sr-blueprint-join?code='+encodeURIComponent(joinCode))
    .then(function(r){return r.json();})
    .then(function(data){
      if(!data||!data.ok){renderJoinError();return;}
      if(data.status==='ready_for_comparison'){renderPairComplete();return;}
      var savedCid='';
      try{savedCid=localStorage.getItem('sr:join:'+joinCode)||'';}catch(_){}
      if(savedCid){cid=savedCid;forcedTier='deep';boot();return;}
      renderJoinWelcome(data.primaryFirstName||'');
    })
    .catch(function(){renderJoinError();});
}

function renderJoinWelcome(primaryName){
  var who=primaryName?esc(primaryName)+"'s":'a Linked Pair';
  var stage=document.getElementById('stage');
  stage.innerHTML='<div class="card interstitial">'
    +'<h2>You are joining '+who+' Blueprint.</h2>'
    +'<p>Your assessment is included. Nothing to pay. You will answer the full set of questions, about 45 minutes, and your own complete Blueprint arrives by email when you finish. Tell us who you are and we will get started.</p>'
    +'<form id="joinForm" style="max-width:380px;margin:0 auto;text-align:left;">'
    +'<label class="field-label" for="jFirst">First name</label>'
    +'<input class="field" id="jFirst" type="text" autocomplete="given-name" required />'
    +'<label class="field-label" for="jLast">Last name</label>'
    +'<input class="field" id="jLast" type="text" autocomplete="family-name" required />'
    +'<label class="field-label" for="jEmail">Email (your Blueprint is delivered here)</label>'
    +'<input class="field" id="jEmail" type="email" autocomplete="email" required />'
    +'<div style="text-align:center;margin-top:8px;"><button type="submit" class="btn btn-primary" id="joinBtn">Start My Assessment</button></div>'
    +'<div class="err" id="joinErr"></div>'
    +'</form></div>';
  document.getElementById('joinForm').addEventListener('submit',function(ev){
    ev.preventDefault();
    var first=document.getElementById('jFirst').value.trim();
    var last=document.getElementById('jLast').value.trim();
    var email=document.getElementById('jEmail').value.trim();
    var errEl=document.getElementById('joinErr');
    errEl.style.display='none';
    if(!first||!last||!email){errEl.textContent='We need your name and email to deliver your Blueprint.';errEl.style.display='block';return;}
    var btn=document.getElementById('joinBtn');
    btn.disabled=true;btn.textContent='One moment...';
    fetch('/api/sr-blueprint-join',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({code:joinCode,firstName:first,lastName:last,email:email})
    }).then(function(r){return r.json();})
      .then(function(data){
        if(data&&data.ok&&data.cid){
          try{localStorage.setItem('sr:join:'+joinCode,data.cid);}catch(_){}
          cid=data.cid;forcedTier='deep';boot();
        }else if(data&&data.error==='code_in_use'){
          errEl.textContent='Someone already joined with this code. If that someone is you, use the same email you entered the first time.';
          errEl.style.display='block';btn.disabled=false;btn.textContent='Start My Assessment';
        }else if(data&&data.error==='already_complete'){
          renderPairComplete();
        }else{
          errEl.textContent='We could not get you registered. Please try again, and if it keeps happening reach out to dennis@dennisnickens.com.';
          errEl.style.display='block';btn.disabled=false;btn.textContent='Start My Assessment';
        }
      })
      .catch(function(){
        errEl.textContent='We could not reach the server. Please check your connection and try again.';
        errEl.style.display='block';btn.disabled=false;btn.textContent='Start My Assessment';
      });
  });
}

function renderJoinError(){
  document.getElementById('stage').innerHTML='<div class="card interstitial">'
    +'<h2>We could not find that invite.</h2>'
    +'<p>This link may have expired or been mistyped. Ask the person who sent it to share it again, or reach out to dennis@dennisnickens.com and we will get you in.</p>'
    +'</div>';
}

function renderPairComplete(){
  document.getElementById('stage').innerHTML='<div class="card interstitial">'
    +'<h2>This pair is already complete.</h2>'
    +'<p>Both Blueprints are delivered. Check your inbox, and if you cannot find yours reach out to dennis@dennisnickens.com.</p>'
    +'</div>';
}

if(joinCode&&!cid){joinBoot();}else{boot();}

// Particle background (matches the rest of the funnel)
var cv=document.getElementById('pc'),cx=cv.getContext('2d');var ps=[];function rsz(){cv.width=window.innerWidth;cv.height=window.innerHeight;}rsz();window.addEventListener('resize',rsz);function P(){this.reset();}P.prototype.reset=function(){this.x=Math.random()*cv.width;this.y=Math.random()*cv.height;this.vx=(Math.random()-.5)*.35;this.vy=(Math.random()-.5)*.35;this.r=Math.random()*1.6+.3;this.a=Math.random()*.45+.08;var t=Math.random();this.c=t>.65?'#7C3AED':t>.35?'#3B82F6':'#FFD700';};P.prototype.update=function(){this.x+=this.vx;this.y+=this.vy;if(this.x<0||this.x>cv.width||this.y<0||this.y>cv.height)this.reset();};P.prototype.draw=function(){cx.beginPath();cx.arc(this.x,this.y,this.r,0,Math.PI*2);cx.fillStyle=this.c;cx.globalAlpha=this.a;cx.fill();cx.globalAlpha=1;};for(var i=0;i<110;i++)ps.push(new P());function ani(){cx.clearRect(0,0,cv.width,cv.height);for(var i=0;i<ps.length;i++){ps[i].update();ps[i].draw();}requestAnimationFrame(ani);}ani();
</script>
</body>
</html>
