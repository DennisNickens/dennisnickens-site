<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>The Blueprint</title>
<link rel="canonical" href="https://dennisnickens.com/assessment/intake.html" />
</head>
<body>
<p>Redirecting to <a href="intake.html" id="fallbackLink">the assessment</a>...</p>
<script>
// Linked Pair invites arrive as /assessment/?join={CODE}; those go to the
// questionnaire's join flow. Everyone else goes to the intake, with any
// query params preserved.
(function(){
  var search=window.location.search||'';
  var dest=new URLSearchParams(search).get('join')?'questionnaire.html':'intake.html';
  document.getElementById('fallbackLink').href=dest+search;
  window.location.replace(dest+search);
})();
</script>
</body>
</html>
