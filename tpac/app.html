<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>T-PAC | Total Package Bowling Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Rubik:wght@400;500;700&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#111823; --panel:#1A2331; --panel2:#212D3F; --line:#2C3A50;
  --amber:#FFB454; --amber-deep:#E08E1B; --green:#2E9E5B; --red:#E2483D;
  --ink:#F3EFE6; --muted:#93A0B4; --faint:#5D6B80;
  --display:'Lilita One',sans-serif; --body:'Rubik',sans-serif; --mono:'IBM Plex Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{font-family:var(--body);background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;}
button{font-family:inherit;}
input,select,textarea{font-family:inherit;font-size:16px;}

/* Chrome */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;padding:12px 16px;background:rgba(17,24,35,.92);backdrop-filter:blur(10px);border-bottom:2px solid var(--line);}
.brand{font-family:var(--display);font-size:1.3rem;letter-spacing:.02em;color:var(--amber);}
.brand small{font-family:var(--mono);font-size:.6rem;color:var(--muted);display:block;letter-spacing:.16em;margin-top:-2px;}
.top-right{margin-left:auto;font-family:var(--mono);font-size:.68rem;color:var(--muted);letter-spacing:.08em;}
#view{max-width:560px;margin:0 auto;padding:18px 14px 96px;}
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:40;display:none;grid-template-columns:repeat(5,1fr);background:#0C121B;border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom);}
.tabbar button{background:none;border:none;color:var(--faint);padding:10px 4px 12px;min-height:56px;cursor:pointer;font-size:.66rem;font-weight:500;letter-spacing:.04em;display:flex;flex-direction:column;align-items:center;gap:3px;}
.tabbar button .ico{font-size:1.25rem;line-height:1;}
.tabbar button.active{color:var(--amber);}
.tabbar button:focus-visible{outline:2px solid var(--amber);outline-offset:-2px;}

/* Cards and forms */
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 16px;margin-bottom:14px;}
h1.page{font-family:var(--display);font-size:1.55rem;margin:6px 2px 14px;letter-spacing:.01em;}
h2.sec{font-family:var(--display);font-size:1.05rem;color:var(--amber);margin-bottom:10px;letter-spacing:.02em;}
.hint{font-size:.82rem;color:var(--muted);}
label.f{display:block;font-family:var(--mono);font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:12px 2px 5px;}
input.f,select.f,textarea.f{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 13px;color:var(--ink);min-height:46px;}
input.f:focus,select.f:focus,textarea.f:focus{outline:2px solid var(--amber);outline-offset:1px;border-color:var(--amber);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border:none;border-radius:12px;padding:13px 18px;font-family:var(--display);font-size:1rem;letter-spacing:.03em;cursor:pointer;background:var(--amber);color:#1A1206;margin-top:14px;transition:transform .08s;}
.btn:active{transform:scale(.98);}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:2px;}
.btn.ghost{background:transparent;color:var(--amber);border:2px solid var(--amber);}
.btn.green{background:var(--green);color:#08110B;}
.btn.quiet{background:var(--panel2);color:var(--muted);border:1px solid var(--line);font-family:var(--body);font-weight:500;font-size:.85rem;min-height:44px;}
.btn:disabled{opacity:.45;cursor:default;}
.err{background:rgba(226,72,61,.14);border:1px solid var(--red);border-radius:10px;padding:11px 13px;color:#FFB1AA;font-size:.85rem;margin-top:12px;display:none;}
.pill{display:inline-block;font-family:var(--mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;border-radius:100px;padding:3px 10px;border:1px solid var(--line);color:var(--muted);}
.pill.live{border-color:var(--green);color:var(--green);}
.pill.amber{border-color:var(--amber);color:var(--amber);}
.pill.red{border-color:var(--red);color:var(--red);}
.row{display:flex;align-items:center;gap:10px;}
.row .grow{flex:1;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

/* Ace chat */
.ace-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.ace-avatar{width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#2E9E5B,#17452A);border:3px solid var(--amber);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:1.5rem;color:var(--amber);overflow:hidden;flex:0 0 54px;}
.ace-avatar img{width:100%;height:100%;object-fit:cover;}
.ace-name{font-family:var(--display);font-size:1.1rem;}
.ace-sub{font-size:.75rem;color:var(--muted);}
.chat{display:flex;flex-direction:column;gap:10px;margin-bottom:14px;min-height:180px;}
.msg{max-width:86%;padding:11px 14px;border-radius:16px;font-size:.93rem;white-space:pre-wrap;word-break:break-word;}
.msg.ace{background:var(--panel2);border:1px solid var(--line);border-bottom-left-radius:4px;align-self:flex-start;}
.msg.me{background:var(--amber);color:#1A1206;border-bottom-right-radius:4px;align-self:flex-end;}
.msg.typing{color:var(--muted);font-style:italic;}
.chatbar{position:fixed;bottom:58px;left:0;right:0;z-index:39;background:#0C121B;border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:none;}
.chatbar .inner{max-width:560px;margin:0 auto;display:flex;gap:8px;}
.chatbar textarea{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px 13px;color:var(--ink);resize:none;height:48px;}
.chatbar button{min-width:64px;border:none;border-radius:12px;background:var(--amber);color:#1A1206;font-family:var(--display);cursor:pointer;}

/* Scoreboard strip: the signature element */
.board{background:#0A0F16;border:2px solid var(--line);border-radius:10px;overflow:hidden;margin:10px 0;}
.board .who{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-bottom:1px solid var(--line);font-size:.8rem;}
.board .who .nm{font-weight:700;}
.board .who .tot{font-family:var(--mono);font-weight:700;font-size:1.05rem;color:var(--amber);}
.frames{display:grid;grid-template-columns:repeat(10,1fr);}
.fr{border-right:1px solid var(--line);padding:4px 0 5px;text-align:center;min-height:52px;}
.fr:last-child{border-right:none;}
.fr .marks{font-family:var(--mono);font-size:.78rem;font-weight:700;letter-spacing:1px;color:var(--ink);min-height:16px;}
.fr .marks .x{color:var(--red);}
.fr .cum{font-family:var(--mono);font-size:.82rem;font-weight:700;color:var(--amber);margin-top:3px;min-height:16px;}
.fr .num{font-size:.55rem;color:var(--faint);}
.fr.now{background:rgba(255,180,84,.12);}

/* Frame entry keypad */
.pad{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:12px;}
.pad button{min-height:48px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--ink);font-family:var(--mono);font-weight:700;font-size:1rem;cursor:pointer;}
.pad button:active{background:var(--amber);color:#1A1206;}
.pad button:disabled{opacity:.3;}

/* Bracket tree */
.round{margin-bottom:16px;}
.round h3{font-family:var(--mono);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
.mcard{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;}
.mcard .p{display:flex;justify-content:space-between;font-size:.9rem;padding:3px 0;}
.mcard .p .sc{font-family:var(--mono);font-weight:700;}
.mcard .p.win{color:var(--green);font-weight:700;}
.mcard .p.lose{color:var(--faint);}

/* Ledger */
.ledger td,.ledger th{padding:7px 6px;font-size:.82rem;text-align:left;border-bottom:1px solid var(--line);}
.ledger th{font-family:var(--mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}
.ledger .amt{font-family:var(--mono);text-align:right;}
.disclaim{font-size:.74rem;color:var(--muted);background:rgba(255,180,84,.07);border:1px dashed var(--amber-deep);border-radius:10px;padding:10px 12px;margin-top:12px;}

/* Onboarding */
.steps{font-family:var(--mono);font-size:.66rem;letter-spacing:.14em;color:var(--muted);margin-bottom:8px;}
.choice{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:13px 14px;margin-bottom:8px;color:var(--ink);font-size:.92rem;cursor:pointer;min-height:48px;}
.choice small{display:block;color:var(--muted);font-size:.76rem;}
.choice.sel{border-color:var(--amber);background:rgba(255,180,84,.1);}
.choice:focus-visible{outline:2px solid var(--amber);}

.list-item{display:flex;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px solid var(--line);}
.list-item:last-child{border-bottom:none;}
.center{text-align:center;}
.big-timer{font-family:var(--mono);font-size:1.6rem;color:var(--amber);font-weight:700;}
a{color:var(--amber);}
@media(min-width:561px){#view{padding-top:26px;}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">T-PAC<small>TOTAL PACKAGE BOWLING</small></div>
  <div class="top-right" id="topStatus"></div>
</header>
<main id="view" aria-live="polite"></main>
<div class="chatbar" id="chatbar">
  <div class="inner">
    <textarea id="chatInput" placeholder="Ask Ace anything about your game" aria-label="Message to Ace"></textarea>
    <button id="chatSend" aria-label="Send message">Send</button>
  </div>
</div>
<nav class="tabbar" id="tabbar" aria-label="Main">
  <button data-tab="coach"><span class="ico" aria-hidden="true">&#127919;</span>Coach</button>
  <button data-tab="bag"><span class="ico" aria-hidden="true">&#127923;</span>My Bag</button>
  <button data-tab="scores"><span class="ico" aria-hidden="true">&#128221;</span>Scores</button>
  <button data-tab="compete"><span class="ico" aria-hidden="true">&#127942;</span>Compete</button>
  <button data-tab="account"><span class="ico" aria-hidden="true">&#9881;&#65039;</span>Account</button>
</nav>
<script src="js/scoring.js"></script>
<script src="js/app.js"></script>
</body>
</html>
